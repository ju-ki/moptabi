version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nextjs-app
    ports:
      - '3000:3000'
    depends_on:
      - dev-db
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./backend/src:/app/backend/src
    working_dir: /app/frontend
    tty: true
    stdin_open: true

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hono-api
    ports:
      - '8787:8787'
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: true
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    working_dir: /app/backend
    tty: true
    stdin_open: true

  dev-db:
    container_name: postgres
    hostname: db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: 'travel_user'
      POSTGRES_PASSWORD: 'travel_admin'
      POSTGRES_DB: 'ai_travel'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
  test-db:
    container_name: postgres_test
    hostname: test-db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: 'travel_user_test'
      POSTGRES_PASSWORD: 'travel_admin_test'
      POSTGRES_DB: 'ai_travel_test'
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql

volumes:
  postgres-data:
  postgres-test-data:
