name: Staging Preview

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: staging-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    outputs:
      backend_url: ${{ steps.capture.outputs.backend_url }}
      worker_name: ${{ steps.meta.outputs.worker_name }}
      branch_alias: ${{ steps.meta.outputs.branch_alias }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute preview metadata
        id: meta
        run: |
          set -euo pipefail
          pr_number="${{ github.event.pull_request.number }}"
          echo "worker_name=moptabi-backend-pr-${pr_number}" >> "$GITHUB_OUTPUT"
          echo "branch_alias=pr-${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install

      - name: Install root dependencies for shared-types
        run: npm --prefix .. ci --ignore-scripts

      - name: Build shared-types
        run: bunx tsc -p ../packages/shared-types/tsconfig.json

      - name: Build backend
        run: bun run build

      - name: Prime backend worker
        run: |
          set -euo pipefail
          bunx wrangler deploy \
            --config wrangler.toml \
            --name "${{ steps.meta.outputs.worker_name }}" \
            --keep-vars \
            --var NODE_ENV:staging \
            --var ALLOWED_ORIGIN_SUFFIXES:.pages.dev,.workers.dev \
            >/tmp/backend-prime.log 2>&1

      - name: Upload backend secrets
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          printf 'DATABASE_URL=%s\n' "$STAGING_DATABASE_URL" > "$secrets_file"
          bunx wrangler secret bulk "$secrets_file" \
            --config wrangler.toml \
            --name "${{ steps.meta.outputs.worker_name }}"
          rm -f "$secrets_file"

      - name: Deploy backend preview
        run: |
          set -euo pipefail
          bunx wrangler deploy \
            --config wrangler.toml \
            --name "${{ steps.meta.outputs.worker_name }}" \
            --keep-vars \
            --var NODE_ENV:staging \
            --var ALLOWED_ORIGIN_SUFFIXES:.pages.dev,.workers.dev \
            2>&1 | tee backend-deploy.log

      - name: Capture backend URL
        id: capture
        run: |
          set -euo pipefail
          backend_url="$(grep -Eo 'https://[^ ]+workers\.dev' backend-deploy.log | tail -n 1)"
          if [ -z "$backend_url" ]; then
            echo "Failed to detect backend URL from backend-deploy.log" >&2
            exit 1
          fi
          echo "backend_url=$backend_url" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
    defaults:
      run:
        working-directory: ./frontend
    outputs:
      frontend_url: ${{ steps.capture.outputs.frontend_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FRONTEND_WORKER_NAME: moptabi-frontend-staging
      NEXT_PUBLIC_API_BASE_URL: ${{ needs.deploy-backend.outputs.backend_url }}/api
      NEXT_PUBLIC_GOOGLE_MAP_API_KEY: ${{ secrets.STAGING_GOOGLE_MAP_API_KEY }}
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install root dependencies for shared-types
        run: npm --prefix .. ci --ignore-scripts --include=dev

      - name: Build shared-types
        run: npm exec -- tsc -p ../packages/shared-types/tsconfig.json

      - name: Build frontend for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy frontend preview
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --config wrangler.jsonc \
            --name "${FRONTEND_WORKER_NAME}" \
            --keep-vars \
            --var NODE_ENV:production \
            --var NEXTAUTH_URL:https://${FRONTEND_WORKER_NAME}.workers.dev \
            --var AUTH_URL:https://${FRONTEND_WORKER_NAME}.workers.dev/api/auth \
            2>&1 | tee frontend-deploy.log

      - name: Upload frontend auth secrets
        env:
          STAGING_AUTH_URL: ${{ secrets.AUTH_URL }}
          STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          STAGING_AUTH_GOOGLE_ID: ${{ secrets.STAGING_AUTH_GOOGLE_ID }}
          STAGING_AUTH_GOOGLE_SECRET: ${{ secrets.STAGING_AUTH_GOOGLE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_AUTH_URL:-}" ] || [ -z "${STAGING_AUTH_SECRET:-}" ] || [ -z "${STAGING_AUTH_GOOGLE_ID:-}" ] || [ -z "${STAGING_AUTH_GOOGLE_SECRET:-}" ]; then
            echo "Missing one of required secrets: STAGING_AUTH_URL, STAGING_AUTH_SECRET, STAGING_AUTH_GOOGLE_ID, STAGING_AUTH_GOOGLE_SECRET" >&2
            exit 1
          fi

          secrets_file="$(mktemp)"
          {
            printf 'AUTH_URL=%s\n' "$STAGING_AUTH_URL"
            printf 'AUTH_SECRET=%s\n' "$STAGING_AUTH_SECRET"
            printf 'AUTH_GOOGLE_ID=%s\n' "$STAGING_AUTH_GOOGLE_ID"
            printf 'AUTH_GOOGLE_SECRET=%s\n' "$STAGING_AUTH_GOOGLE_SECRET"
          } > "$secrets_file"

          npx wrangler secret bulk "$secrets_file" \
            --config wrangler.jsonc \
            --name "${FRONTEND_WORKER_NAME}"

          rm -f "$secrets_file"

      - name: Capture frontend URL
        id: capture
        run: |
          set -euo pipefail
          frontend_url="https://${FRONTEND_WORKER_NAME}.workers.dev"
          parsed_url="$(grep -Eo 'https://[^ ]+workers\.dev' frontend-deploy.log | tail -n 1 || true)"
          if [ -n "$parsed_url" ]; then
            frontend_url="$parsed_url"
          fi
          echo "frontend_url=$frontend_url" >> "$GITHUB_OUTPUT"

  verify-routing:
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
      - deploy-frontend
    steps:
      - name: Wait for backend health
        run: |
          set -euo pipefail
          backend_health_url="${{ needs.deploy-backend.outputs.backend_url }}/api/health"
          for attempt in $(seq 1 20); do
            if curl -fsS "$backend_health_url" >/dev/null; then
              exit 0
            fi
            echo "Backend not ready yet: $attempt"
            sleep 10
          done
          echo "Backend health check failed" >&2
          exit 1

      - name: Wait for backend DB health
        run: |
          set -euo pipefail
          backend_db_health_url="${{ needs.deploy-backend.outputs.backend_url }}/api/health/db"
          for attempt in $(seq 1 20); do
            if curl -fsS "$backend_db_health_url" >/dev/null; then
              exit 0
            fi
            echo "Backend DB not ready yet: $attempt"
            sleep 10
          done
          echo "Backend DB health check failed" >&2
          exit 1

      - name: Wait for frontend response
        run: |
          set -euo pipefail
          frontend_url="${{ needs.deploy-frontend.outputs.frontend_url }}"
          for attempt in $(seq 1 20); do
            if curl -fsS "$frontend_url" >/dev/null; then
              exit 0
            fi
            echo "Frontend not ready yet: $attempt"
            sleep 10
          done
          echo "Frontend health check failed" >&2
          exit 1

  comment-preview:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - deploy-backend
      - deploy-frontend
      - verify-routing
    steps:
      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- staging-preview-report -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;

            const backendResult = ${{ toJSON(needs.deploy-backend.result) }};
            const frontendResult = ${{ toJSON(needs.deploy-frontend.result) }};
            const verifyResult = ${{ toJSON(needs.verify-routing.result) }};
            const frontendUrl = ${{ toJSON(needs.deploy-frontend.outputs.frontend_url) }};
            const backendUrl = ${{ toJSON(needs.deploy-backend.outputs.backend_url) }};
            const workerName = ${{ toJSON(needs.deploy-backend.outputs.worker_name) }};
            const branchAlias = ${{ toJSON(needs.deploy-backend.outputs.branch_alias) }};
            const sha = context.payload.pull_request.head.sha;
            const updatedAt = new Date().toISOString();

            const status = backendResult === 'success' && frontendResult === 'success' && verifyResult === 'success'
              ? '✅ Success'
              : '❌ Failed';

            const lines = [
              marker,
              '## Staging Preview',
              '',
              `- Status: ${status}`,
              `- Frontend: ${frontendUrl || 'N/A'}`,
              `- Backend: ${backendUrl || 'N/A'}`,
              `- Backend Worker: ${workerName || 'N/A'}`,
              `- Frontend Worker: moptabi-frontend-staging`,
              `- Backend Branch Alias: ${branchAlias || 'N/A'}`,
              `- SHA: ${sha}`,
              `- Updated At: ${updatedAt}`,
              '',
              '### Job Results',
              `- deploy-backend: ${backendResult}`,
              `- deploy-frontend: ${frontendResult}`,
              `- verify-routing: ${verifyResult}`,
            ];

            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }